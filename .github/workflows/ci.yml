name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: minimum
            node: '24.0.0'
          - runtime: tooling
            node: ''
    name: Verify (${{ matrix.runtime }})
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          # An explicit version takes precedence; otherwise use the tooling pin.
          node-version: ${{ matrix.node }}
          node-version-file: .node-version
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:runtimes
      - run: bun run build
      - run: bun run test:node
